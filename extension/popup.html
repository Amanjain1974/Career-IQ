<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; margin: 0; }
    h2 { font-size: 16px; margin-top: 0; color: #4F46E5; }
    p { font-size: 12px; color: #4b5563; }
    input, select { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; }
    button { width: 100%; padding: 8px; background-color: #4F46E5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    button:hover { background-color: #4338ca; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <h2>Save to CareerIQ</h2>
  <p>We will extract the job description from the page automatically.</p>
  
  <input type="text" id="company" placeholder="Company Name (e.g. Google)">
  <input type="text" id="role" placeholder="Job Title (e.g. Data Engineer)">
  <input type="text" id="location" placeholder="Location">
  <select id="workMode">
    <option value="Remote">Remote</option>
    <option value="Hybrid">Hybrid</option>
    <option value="On-site">On-site</option>
  </select>

  <button id="saveBtn">Extract & Save Job</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
